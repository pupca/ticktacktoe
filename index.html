<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic·Tac·Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>Tic·Tac·Toe</h1>
      <p class="subtitle">Two players, one screen. Three in a row wins.</p>
    </header>

    <section class="board-card" aria-label="Game board">
      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    </section>

    <!-- GM-1243 / GM-1246: score board, kept only in the page -->
    <section class="card score-card" aria-label="Score">
      <span class="card-label">Score</span>
      <div class="tiles">
        <div class="tile x"><span class="tile-name">Player X</span><span class="tile-count" id="score-x">0</span><span class="badge" id="badge-x" hidden>+1</span></div>
        <div class="tile o"><span class="tile-name">Player O</span><span class="tile-count" id="score-o">0</span><span class="badge" id="badge-o" hidden>+1</span></div>
      </div>
      <p class="score-note">Draws don't count. Score resets when the page is reloaded.</p>
      <span class="sr-only" id="score-live" aria-live="polite"></span>
    </section>

    <aside class="side">
      <div class="card turn-card" aria-live="polite">
        <span class="card-label" id="status-label">Next turn</span>
        <span class="pill" id="status">Player X</span>
      </div>
      <button class="button" id="restart" type="button">Restart round</button>
    </aside>

    <footer class="rules">Draw = all nine squares filled without a winner.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
