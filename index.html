<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic·Tac·Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>Tic·Tac·Toe</h1>
      <p class="subtitle">Two players, one screen. Three in a row wins.</p>
    </header>

    <section class="board-card" aria-label="Game board">
      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    </section>

    <aside class="side">
      <div class="card turn-card" aria-live="polite">
        <span class="card-label" id="status-label">Next turn</span>
        <span class="pill" id="status">Player X</span>
      </div>
      <button class="button" id="restart" type="button">Restart round</button>
      <div class="card score-card" aria-label="Score">
        <span class="card-label">Score</span>
        <div class="score-row">
          <span class="score-player"><span class="dot dot-x"></span>Player X</span>
          <span class="score-count" id="score-x">0</span>
        </div>
        <div class="score-row">
          <span class="score-player"><span class="dot dot-o"></span>Player O</span>
          <span class="score-count" id="score-o">0</span>
        </div>
      </div>
    </aside>

    <footer class="rules">Draw = all nine squares filled without a winner.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
