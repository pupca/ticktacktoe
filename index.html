<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic·Tac·Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>Tic·Tac·Toe</h1>
      <p class="subtitle">Two players, one screen. Three in a row wins.</p>
    </header>

    <section class="board-card">
      <div class="board" id="board"></div>
    </section>

    <aside class="side">
      <div class="card turn-card">
        <span class="card-label" id="status-label">Next turn</span>
        <span class="pill x" id="status">Player X</span>
      </div>
    </aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
