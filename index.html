<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic·Tac·Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title">
      <h1>Tic·Tac·Toe</h1>
      <p class="subtitle">Two players, one screen. Three in a row wins.</p>
    </header>

    <section class="card score-card" id="score" role="group" aria-label="Score (rounds won)">
      <span class="card-label" aria-hidden="true">Score (rounds won)</span>
      <div class="score-pills" aria-live="polite">
        <span class="score-pill x" id="score-x" role="text" aria-label="X, 0 wins"><span class="score-player" aria-hidden="true">X</span><span class="score-count" id="score-x-count" aria-hidden="true">0</span></span>
        <span class="score-pill o" id="score-o" role="text" aria-label="O, 0 wins"><span class="score-player" aria-hidden="true">O</span><span class="score-count" id="score-o-count" aria-hidden="true">0</span></span>
      </div>
      <p class="score-hint" id="score-hint">No rounds played yet</p>
    </section>

    <section class="board-card" aria-label="Game board">
      <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    </section>

    <aside class="side">
      <div class="card turn-card" aria-live="polite">
        <span class="card-label" id="status-label">Next turn</span>
        <span class="pill" id="status">Player X</span>
      </div>
      <button class="button" id="restart" type="button">Restart round</button>
    </aside>

    <footer class="rules">Draw = all nine squares filled without a winner.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
